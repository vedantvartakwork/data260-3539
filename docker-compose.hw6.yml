services:
  mongodb:
    image: mongo:7.0
    container_name: data260-3539-hw6-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: s3539_doc
    volumes:
      - hw6_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  hw6_mongodb_data:
