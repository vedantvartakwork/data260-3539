services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: s3539-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  topic-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init-hw8-topics.sh"]
    volumes:
      - ./scripts/init_hw8_topics.sh:/init-hw8-topics.sh:ro

  recall-worker:
    build:
      context: .
      dockerfile: Dockerfile.hw8
    command: python -m code.hw8.worker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      topic-init:
        condition: service_completed_successfully

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.hw8
    command: uvicorn code.hw8.api:app --host 0.0.0.0 --port 8839
    ports:
      - "8839:8839"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      topic-init:
        condition: service_completed_successfully

  planner:
    build:
      context: .
      dockerfile: Dockerfile.hw8
    command: python -m code.hw8.planner
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      topic-init:
        condition: service_completed_successfully

  writer-1:
    build:
      context: .
      dockerfile: Dockerfile.hw8
    command: python -m code.hw8.writer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      topic-init:
        condition: service_completed_successfully

  writer-2:
    build:
      context: .
      dockerfile: Dockerfile.hw8
    command: python -m code.hw8.writer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      topic-init:
        condition: service_completed_successfully

  reviewer:
    build:
      context: .
      dockerfile: Dockerfile.hw8
    command: python -m code.hw8.reviewer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      topic-init:
        condition: service_completed_successfully

