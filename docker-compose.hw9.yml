services:
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: s3539-hw9-redis
    ports:
      - "6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - hw9_redis_data:/data

volumes:
  hw9_redis_data:
